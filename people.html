<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>
        CESRG | Control & Energy Systems Research Group
    </title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Control & Energy Systems Research Group at COMSATS University Islamabad — research in control, energy, robotics and intelligent systems.">

    <link rel="stylesheet"
          href="css/modern.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="icon"
          href="thumbs/CESRG_logo_circle02.png">

    <style>

        /* =========================================================
           THEME VARIABLES
           ========================================================= */

        :root {

            --people-bg: #f4f7f5;
            --people-surface: #ffffff;
            --people-heading: #173f35;
            --people-text: #43524d;
            --people-muted: #6c7b76;
            --people-primary: #1f6f5b;
            --people-primary-dark: #145342;
            --people-border: #dce5e1;
            --people-shadow: 0 10px 30px rgba(25, 70, 58, 0.08);

        }


        /* Margalla Mist */

        html[data-theme="margalla"] {

            --people-bg: #f4f7f5;
            --people-surface: #ffffff;
            --people-heading: #173f35;
            --people-text: #43524d;
            --people-muted: #6c7b76;
            --people-primary: #1f6f5b;
            --people-primary-dark: #145342;
            --people-border: #dce5e1;
            --people-shadow: 0 10px 30px rgba(25, 70, 58, 0.08);

        }


        /* Institutional Blue */

        html[data-theme="blue"] {

            --people-bg: #f3f6fa;
            --people-surface: #ffffff;
            --people-heading: #173a63;
            --people-text: #465568;
            --people-muted: #718096;
            --people-primary: #1f5f95;
            --people-primary-dark: #164a75;
            --people-border: #d9e2ec;
            --people-shadow: 0 10px 30px rgba(23, 58, 99, 0.08);

        }


        /* Ivory Press */

        html[data-theme="ivory"] {

            --people-bg: #f7f4ed;
            --people-surface: #fffdf8;
            --people-heading: #3f3428;
            --people-text: #5c5147;
            --people-muted: #81766b;
            --people-primary: #82633f;
            --people-primary-dark: #684d30;
            --people-border: #e5ddd0;
            --people-shadow: 0 10px 30px rgba(75, 59, 42, 0.08);

        }


        /* Sage Calm */

        html[data-theme="sage"] {

            --people-bg: #f2f6f1;
            --people-surface: #ffffff;
            --people-heading: #314a38;
            --people-text: #526256;
            --people-muted: #768178;
            --people-primary: #587a5c;
            --people-primary-dark: #426146;
            --people-border: #dce5dc;
            --people-shadow: 0 10px 30px rgba(49, 74, 56, 0.08);

        }


        /* Indigo Night */

        html[data-theme="indigo"] {

            --people-bg: #111827;
            --people-surface: #182235;
            --people-heading: #e8eefb;
            --people-text: #c3ccdc;
            --people-muted: #8e9ab0;
            --people-primary: #6f8fd4;
            --people-primary-dark: #5878bd;
            --people-border: #2c3950;
            --people-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);

        }


        /* Graphite */

        html[data-theme="graphite"] {

            --people-bg: #1b1d20;
            --people-surface: #24272b;
            --people-heading: #f0f1f2;
            --people-text: #c8ccd0;
            --people-muted: #92979d;
            --people-primary: #aeb5bc;
            --people-primary-dark: #d2d6da;
            --people-border: #373b40;
            --people-shadow: 0 10px 30px rgba(0, 0, 0, 0.28);

        }


        /* =========================================================
           GLOBAL THEME
           ========================================================= */

        html[data-theme] {

            background: var(--people-bg);

        }


        html[data-theme] body {

            background: var(--people-bg) !important;
            color: var(--people-text) !important;
            font-family: "Inter", sans-serif;

        }


        html[data-theme] h1,
        html[data-theme] h2,
        html[data-theme] h3,
        html[data-theme] h4,
        html[data-theme] h5,
        html[data-theme] h6 {

            color: var(--people-heading) !important;

        }


        html[data-theme] p {

            color: var(--people-text);

        }


        /* =========================================================
           HEADER
           ========================================================= */

        html[data-theme] .masthead {

            background: var(--people-surface) !important;
            border-bottom: 1px solid var(--people-border) !important;

        }


        html[data-theme] .navbar {

            background: var(--people-surface) !important;

        }


        html[data-theme] .navbar-inner {

            background: var(--people-surface) !important;
            border: none !important;
            box-shadow: none !important;

        }


        html[data-theme] .masthead .container {

            background: transparent !important;

        }


        /* =========================================================
           CESRG BRAND / LOGO ALIGNMENT
           ========================================================= */

        html[data-theme] .navbar-inner .container {

            display: flex !important;
            align-items: center !important;

        }


        html[data-theme] .people-brand {

            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;

            gap: 9px !important;

            height: 42px !important;

            padding: 0 !important;
            margin: 0 !important;

            line-height: 1 !important;

            vertical-align: middle !important;

            color: var(--people-heading) !important;

        }


        html[data-theme] .people-brand img {

            display: block !important;

            width: 42px !important;
            height: 42px !important;

            object-fit: contain !important;

            margin: 0 !important;
            padding: 0 !important;

        }


        html[data-theme] .people-brand span {

            display: inline-flex !important;
            align-items: center !important;

            height: 42px !important;

            margin: 0 !important;
            padding: 0 !important;

            line-height: 1 !important;

        }


        html[data-theme] .people-brand:hover {

            color: var(--people-primary) !important;

        }


        /* =========================================================
           NAVIGATION TABS
           ========================================================= */

        html[data-theme] .nav {

            display: flex;

            align-items: center;

        }


        html[data-theme] .nav li {

            display: flex;

            align-items: center;

        }


        html[data-theme] .nav li a {

            color: var(--people-text) !important;

        }


        html[data-theme] .nav li a:hover {

            color: var(--people-primary) !important;

        }


        html[data-theme] .nav li.active a {

            color: var(--people-primary) !important;

        }


        /* =========================================================
           MOBILE TOGGLE
           ========================================================= */

        html[data-theme] .cesrg-mobile-toggle {

            color: var(--people-heading) !important;
            background: transparent !important;
            border: none !important;

        }


        /* =========================================================
           PEOPLE GRID
           ========================================================= */

        html[data-theme] .people-grid {

            background: transparent;

        }


        html[data-theme] .person-card {

            background: var(--people-surface) !important;

            border: 1px solid var(--people-border) !important;

            box-shadow: var(--people-shadow) !important;

        }


        html[data-theme] .person-card h3 {

            color: var(--people-heading) !important;

        }


        html[data-theme] .person-card p {

            color: var(--people-text) !important;

        }


        html[data-theme] .person-role {

            color: var(--people-primary) !important;

        }


        html[data-theme] .person-image-wrapper {

            background: var(--people-bg) !important;

            border-color: var(--people-border) !important;

        }


        /* =========================================================
           SECTION NAVIGATION
           ========================================================= */

        html[data-theme] .section-navigation {

            background: var(--people-surface) !important;

            border: 1px solid var(--people-border) !important;

            box-shadow: var(--people-shadow) !important;

        }


        html[data-theme] .section-navigation a {

            color: var(--people-text) !important;

        }


        html[data-theme] .section-navigation a:hover {

            color: var(--people-primary) !important;

        }


        /* =========================================================
           EXPERTISE BOX
           ========================================================= */

        html[data-theme] .expertise-box {

            background: var(--people-surface) !important;

            border: 1px solid var(--people-border) !important;

            box-shadow: var(--people-shadow) !important;

        }


        html[data-theme] .expertise-box h3 {

            color: var(--people-heading) !important;

        }


        html[data-theme] .expertise-box p {

            color: var(--people-text) !important;

        }


        /* =========================================================
           FOOTER
           ========================================================= */

        html[data-theme] footer {

            background: var(--people-surface) !important;

            border-top: 1px solid var(--people-border) !important;

            color: var(--people-text) !important;

        }


        html[data-theme] footer p,
        html[data-theme] footer span {

            color: var(--people-muted) !important;

        }


        html[data-theme] footer a {

            color: var(--people-primary) !important;

        }


        /* =========================================================
           MOBILE
           ========================================================= */

        @media (max-width: 768px) {

            html[data-theme] .navbar-inner .container {

                display: flex !important;
                align-items: center !important;

            }


            html[data-theme] .people-brand {

                height: 42px !important;

            }


            html[data-theme] .people-brand img {

                width: 42px !important;
                height: 42px !important;

            }


            html[data-theme] .people-grid {

                grid-template-columns: 1fr !important;

            }


            html[data-theme] .person-image-wrapper {

                margin-left: auto;
                margin-right: auto;

            }


            html[data-theme] .section-navigation {

                width: 100%;

            }


            html[data-theme] .expertise-box {

                width: 100%;

            }

        }

    </style>

</head>
